[project]
name = "qemu-replay-mcp"
version = "0.1.0"
description = "MCP server for time-travel kernel debugging: record a QEMU run once, replay it under a debugger, step backwards, and find the instruction that last wrote any variable."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
# gdbstub-mcp supplies the RSP client, register layout, symbols and backtraces.
# Pinned to the git repo until it is published on PyPI (see BACKLOG.md).
dependencies = [
    "mcp>=2.0.0",
    "gdbstub-mcp @ git+https://github.com/0xmortuex/gdbstub-mcp",
]
keywords = ["mcp", "qemu", "record-replay", "reverse-debugging", "time-travel", "osdev", "kernel", "debugger"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Emulators",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio"]

[project.urls]
Homepage = "https://github.com/0xmortuex/qemu-replay-mcp"

[project.scripts]
qemu-replay-mcp = "qemu_replay_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/qemu_replay_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.mypy.overrides]]
# capstone (pulled in via gdbstub-mcp) ships no type stubs or py.typed marker.
module = ["capstone"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# gdbstub-mcp is fully annotated (mypy --strict clean) but doesn't ship a
# py.typed marker yet; follow its source instead of treating it as Any.
module = ["gdbstub_mcp", "gdbstub_mcp.*"]
follow_untyped_imports = true
